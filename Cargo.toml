[package]
name = "verso-plugin-dnsdhcp"
version = "0.1.0"
edition = "2021"

[dependencies]
# The plugin SDK lives in the shell's repository, released with it; the root
# half (ADR-027) builds on its registry, root dispatcher and committed-config
# reader.
verso-plugin = { path = "../verso-plugin-sdk" }
# The root half reads ubus's and the helper's JSON.
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
